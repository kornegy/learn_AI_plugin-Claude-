name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22']
        include:
          - os: ubuntu-latest
            node: '20'
    defaults:
      run:
        working-directory: server
    steps:
      # Keep LF line endings on Windows (the repository has no .gitattributes: the plugin
      # directory does not accept attributes that rewrite file contents).
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Bundles in dist/ match the sources
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- dist/ ../THIRD_PARTY_NOTICES.md)" ]; then
            git status --short -- dist/ ../THIRD_PARTY_NOTICES.md
            echo "::error::server/dist or THIRD_PARTY_NOTICES.md is stale. Run 'npm run build' in server/ and commit the result."
            exit 1
          fi

  plugin:
    name: Plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict .
