name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22']
        include:
          - os: ubuntu-latest
            node: '20'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Bundles in dist/ match the sources
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: |
          npm run build
          git diff --exit-code -- dist/ || (echo "::error::server/dist is stale. Run 'npm run build' in server/ and commit the result." && exit 1)

  plugin:
    name: Plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict .
